services:
  mysql:
    image: mysql:8.0
    container_name: microservices_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: microservices_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3307:3306"
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    networks:
      - microservices_network

  catalog-service:
    build: ./catalog-service
    container_name: catalog_service
    ports:
      - "3001:80"
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: microservices_db
      DB_USER: app_user
      DB_PASSWORD: app_password
    networks:
      - microservices_network

  ratings-service:
    build: ./ratings-service
    container_name: ratings_service
    ports:
      - "3002:80"
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: microservices_db
      DB_USER: app_user
      DB_PASSWORD: app_password
    networks:
      - microservices_network

  user-service:
    build: ./user-service
    container_name: user_service
    ports:
      - "3003:80"
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: microservices_db
      DB_USER: app_user
      DB_PASSWORD: app_password
      JWT_SECRET: your-secret-key-change-in-production
    networks:
      - microservices_network

  gateway:
    image: nginx:alpine
    container_name: api_gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - catalog-service
      - ratings-service
      - user-service
    networks:
      - microservices_network

networks:
  microservices_network:
    driver: bridge

volumes:
  mysql_data:
